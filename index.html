<script>
(function () {
  const fromBlock = [
    'Truffle & Scent By Lee',
    'DTI BN No. 8301368',
    'TIN: 807-789-743-000',
    'Pembo',
    'Taguig Manila, Philippines',
    '+63956 533 1521'
  ].join('\n');

  const defaultInvoice = {
    logo: './truffleandscent-logo.png?v=final',
    signature: '',
    invoiceNumber: 'INV-T&SBLEE000',
    date: new Date().toISOString().split('T')[0],
    from: fromBlock,
    to: '',
    items: [{ name: 'Mazza Deluxe Black Truffle', qty: 1, price: 649, image: '' }],
    notes: 'Thank you for your business. Please pay within the day.',
    paymentMethod: 'BDO: 008010348061\nGCash: 0954 984 8144\nAileen Alvarez',
    currency: 'PHP',
    discount: 0
  };

  function patchInvoice(raw) {
    let existing = {};
    try { existing = raw ? JSON.parse(raw) : {}; } catch (error) { existing = {}; }
    if (!existing || typeof existing !== 'object' || Array.isArray(existing)) existing = {};
    return {
      ...defaultInvoice,
      ...existing,
      from: fromBlock,
      logo: './truffleandscent-logo.png?v=final'
    };
  }

  localStorage.setItem('currentInvoice', JSON.stringify(patchInvoice(localStorage.getItem('currentInvoice'))));
  localStorage.setItem('invoiceAppVersion', 'truffle-scent-static-final');

  try {
    const savedInvoices = JSON.parse(localStorage.getItem('savedInvoices') || '[]');
    if (Array.isArray(savedInvoices)) {
      localStorage.setItem('savedInvoices', JSON.stringify(savedInvoices.map(function (invoice) {
        return { ...invoice, from: fromBlock, logo: './truffleandscent-logo.png?v=final' };
      })));
    }
  } catch (error) {}
})();
</script>
