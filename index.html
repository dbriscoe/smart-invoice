<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Invoice Builder - Truffle & Scent v12</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0f1f36;
      --muted: #4b5563;
      --line: #dbe3ee;
      --soft: #f8fafc;
      --lilac: #f0ddfb;
      --lilac-deep: #ead4f8;
      --green: #10b981;
      --purple: #4f46e5;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f4f7fb;
      color: var(--ink);
    }

    .app {
      width: min(920px, calc(100% - 32px));
      margin: 24px auto 40px;
    }

    .app-title {
      text-align: center;
      font-size: 30px;
      line-height: 1.2;
      margin: 0 0 34px;
      color: var(--ink);
      font-weight: 700;
    }

    .toolbar {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(15, 31, 54, 0.12);
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    button,
    select,
    input,
    textarea {
      font-family: inherit;
    }

    .button {
      border: 0;
      border-radius: 6px;
      padding: 12px 18px;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .button:hover {
      opacity: 0.92;
    }

    .button:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--purple);
    }

    .btn-secondary {
      background: var(--green);
    }

    .btn-icon {
      background: transparent;
      color: var(--danger);
      padding: 6px;
      min-width: 34px;
    }

    .currency-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      color: var(--ink);
    }

    select {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
      background: #fff;
      color: var(--ink);
      font-size: 14px;
    }

    .invoice-box {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(15, 31, 54, 0.12);
      padding: 24px;
    }

    .invoice-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 28px;
    }

    .logo-container {
      width: 185px;
      min-height: 150px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .logo-container img {
      width: 150px;
      height: 150px;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }



    .eshop-brand {
      margin: -14px 0 22px 0;
      text-align: left;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.18;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .eshop-brand span {
      display: block;
    }

    .invoice-details {
      min-width: 310px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      padding-top: 8px;
    }

    .invoice-title-block {
      width: 100%;
      text-align: right;
      margin-bottom: 6px;
    }

    .invoice-title-block h2 {
      margin: 0;
      text-transform: uppercase;
      font-size: 31px;
      line-height: 1.15;
      letter-spacing: 0;
      color: var(--ink);
    }

    .tax-status {
      margin-top: 8px;
      font-size: 14px;
      letter-spacing: 0;
      font-weight: 700;
      color: #34435a;
      text-align: center;
    }

    .detail-item {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      width: 100%;
    }

    .detail-item label {
      min-width: 84px;
      text-align: right;
      color: #34435a;
      font-size: 15px;
      font-weight: 500;
    }

    .detail-item input {
      width: 180px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
      text-align: right;
      color: var(--ink);
      background: #fff;
      font-size: 14px;
    }

    .address-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }

    h3 {
      margin: 0;
      background: var(--lilac);
      color: var(--ink);
      text-transform: uppercase;
      font-size: 14px;
      letter-spacing: 0;
      padding: 11px 13px;
      border-radius: 6px 6px 0 0;
    }

    textarea,
    .pdf-text-block {
      width: 100%;
      min-height: 74px;
      border: 1px solid var(--line);
      border-top: none;
      border-radius: 0 0 6px 6px;
      padding: 12px;
      resize: vertical;
      font-size: 14px;
      line-height: 1.35;
      color: var(--ink);
      background: #fff;
      overflow-wrap: break-word;
      word-break: normal;
    }

    textarea {
      display: block;
      overflow: hidden;
    }

    .pdf-text-block {
      white-space: pre-wrap;
      resize: none;
      overflow: visible;
    }

    .address-section textarea,
    .address-section .pdf-text-block {
      min-height: 156px;
      font-size: 13px;
      line-height: 1.3;
      padding: 10px 12px;
    }

    .items-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 10px;
      margin-bottom: 6px;
    }

    .items-table thead th {
      background: var(--lilac);
      color: var(--ink);
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0;
      padding: 11px 8px;
      text-align: center;
    }

    .items-table thead th:first-child {
      width: 86px;
    }

    .item-name {
      width: 36%;
    }

    .item-qty {
      width: 95px;
    }

    .item-price {
      width: 115px;
    }

    .item-total {
      width: 135px;
    }

    .item-action {
      width: 56px;
    }

    .items-table tbody td {
      vertical-align: middle;
      padding: 0 7px;
      font-size: 14px;
    }

    .items-table input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--ink);
      background: #fff;
      font-size: 14px;
    }

    .items-table input[type="number"] {
      text-align: center;
    }

    .item-total-cell {
      text-align: right;
      font-weight: 600;
      white-space: nowrap;
    }

    .item-action-cell {
      text-align: center;
    }

    .item-image-uploader {
      width: 50px;
      height: 50px;
      border: 2px dashed #d9e2ef;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      cursor: pointer;
      overflow: hidden;
      background: #fff;
      font-size: 26px;
      line-height: 1;
    }

    .item-image-uploader img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .add-item-row {
      margin-bottom: 28px;
    }

    .totals-and-notes {
      display: grid;
      grid-template-columns: 2fr 1.1fr;
      gap: 24px;
      align-items: start;
      margin-top: 22px;
    }

    .notes-payment {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .notes-payment textarea,
    .notes-payment .pdf-text-block {
      min-height: 72px;
    }

    .notes-payment .payment textarea,
    .notes-payment .payment .pdf-text-block {
      min-height: 136px;
    }

    .totals-section {
      background: var(--lilac);
      border-radius: 6px;
      padding: 16px 14px;
      color: var(--ink);
    }

    .total-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 6px 0;
      font-size: 16px;
    }

    .total-row input {
      width: 95px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      background: #fff;
      font-size: 14px;
    }

    .grand-total {
      border-top: 1px solid #dcc9eb;
      margin-top: 8px;
      padding-top: 16px;
      font-weight: 700;
    }

    .signature-section {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .signature-section h3 {
      background: transparent;
      padding: 0;
      margin-bottom: 18px;
      color: #475569;
    }

    .signature-uploader,
    .signature-container {
      width: 200px;
      height: 80px;
      border: 2px dashed #d9e2ef;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #334155;
      cursor: pointer;
      background: #fff;
      overflow: hidden;
    }

    .signature-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .saved-invoices-container {
      margin-top: 24px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
    }

    .saved-invoices-container h2 {
      margin: 0 0 12px;
    }

    .saved-invoices-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .saved-invoice-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--line);
      padding: 10px 0;
      font-size: 14px;
    }

    .saved-invoice-actions {
      display: flex;
      gap: 8px;
    }

    .invoice-box.pdf-export {
      width: 872px !important;
      max-width: 872px !important;
      min-width: 872px !important;
      padding: 24px !important;
      background: #fff !important;
      box-shadow: none !important;
    }

    .invoice-box.pdf-export .invoice-header {
      display: flex !important;
      flex-direction: row !important;
      justify-content: space-between !important;
      align-items: flex-start !important;
      gap: 24px !important;
    }

    .invoice-box.pdf-export .logo-container {
      width: 185px !important;
      min-height: 150px !important;
      justify-content: flex-start !important;
      align-items: flex-start !important;
    }

    .invoice-box.pdf-export .invoice-details {
      width: auto !important;
      min-width: 310px !important;
      align-items: flex-end !important;
    }

    .invoice-box.pdf-export .invoice-title-block {
      text-align: right !important;
    }

    .invoice-box.pdf-export .address-section {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: 30px !important;
    }

    .invoice-box.pdf-export .totals-and-notes {
      display: grid !important;
      grid-template-columns: 2fr 1.1fr !important;
      gap: 24px !important;
    }

    .invoice-box.pdf-export .items-table {
      display: table !important;
      overflow: visible !important;
      white-space: normal !important;
      width: 100% !important;
    }

    .invoice-box.pdf-export .add-item-row,
    .invoice-box.pdf-export .item-action,
    .invoice-box.pdf-export .item-action-cell,
    .invoice-box.pdf-export .btn-icon {
      display: none !important;
    }

    .invoice-box.pdf-export .item-image-uploader.empty,
    .invoice-box.pdf-export .signature-uploader {
      border-color: transparent !important;
      color: transparent !important;
    }

    @media (max-width: 760px) {
      .app {
        width: min(100% - 22px, 920px);
        margin-top: 18px;
      }

      .app-title {
        font-size: 26px;
        margin-bottom: 20px;
      }

      .toolbar {
        padding: 18px;
      }

      .invoice-box {
        padding: 16px;
      }

      .invoice-header {
        flex-direction: column;
        gap: 12px;
      }

  

    .eshop-brand {
      margin: -14px 0 22px 0;
      text-align: left;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.18;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .eshop-brand span {
      display: block;
    }

    .invoice-details {
        width: 100%;
        min-width: 0;
        align-items: stretch;
      }

      .invoice-title-block {
        text-align: center;
      }

      .invoice-title-block h2 {
        font-size: 27px;
      }

      .address-section,
      .totals-and-notes {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .items-table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }

      .logo-container {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1 class="app-title">Smart Invoice Builder</h1>

    <div class="toolbar">
      <button class="button btn-primary" id="saveInvoiceBtn">Save Invoice</button>
      <button class="button btn-secondary" id="downloadPdfBtn">Download PDF</button>
      <div class="currency-wrap">
        <label for="currency">Currency:</label>
        <select id="currency">
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="PHP" selected>PHP</option>
          <option value="JPY">JPY</option>
          <option value="CAD">CAD</option>
          <option value="AUD">AUD</option>
        </select>
      </div>
    </div>

    <section id="invoice-box" class="invoice-box">
      <div class="invoice-header">
        <div class="logo-container">
          <input id="logo-upload" type="file" accept="image/*" hidden>
          <img id="logo-preview" src="truffleandscent_logo_2.png" alt="Truffle & Scent logo">
        </div>

        <div class="invoice-details">
          <div class="invoice-title-block">
            <h2>Official Invoice</h2>
            <div class="tax-status">NON-VAT</div>
          </div>
          <div class="detail-item">
            <label for="invoiceNumber">Invoice #</label>
            <input id="invoiceNumber" type="text" value="INV-T&SBLEE000">
          </div>
          <div class="detail-item">
            <label for="invoiceDate">Date</label>
            <input id="invoiceDate" type="date">
          </div>
        </div>
      </div>

      <div class="eshop-brand" aria-label="Alvarez Eshop Collections">
        <span>ALVAREZ ESHOP</span>
        <span>COLLECTIONS</span>
      </div>

      <div class="address-section">
        <div class="address-box">
          <h3>From</h3>
          <textarea id="from" data-multiline-field="from" rows="6" placeholder="Who is this invoice from?"></textarea>
        </div>
        <div class="address-box">
          <h3>To</h3>
          <textarea id="to" data-multiline-field="to" rows="6" placeholder="Who is this invoice to?"></textarea>
        </div>
      </div>

      <table class="items-table" id="itemsTable">
        <thead>
          <tr>
            <th></th>
            <th class="item-name">Item</th>
            <th class="item-qty">Qty</th>
            <th class="item-price">Price</th>
            <th class="item-total">Total</th>
            <th class="item-action"></th>
          </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
      </table>

      <div class="add-item-row">
        <button class="button btn-secondary" id="addItemBtn">Add Item</button>
      </div>

      <div class="totals-and-notes">
        <div class="notes-payment">
          <div>
            <h3>Notes</h3>
            <textarea id="notes" data-multiline-field="notes" rows="3" placeholder="Any notes, terms, or delivery info"></textarea>
          </div>
          <div class="payment">
            <h3>Payment Method</h3>
            <textarea id="paymentMethod" data-multiline-field="paymentMethod" rows="5" placeholder="Payment details"></textarea>
          </div>
        </div>

        <div class="totals-section">
          <div class="total-row">
            <span>Subtotal</span>
            <strong id="subtotal">0.00</strong>
          </div>
          <div class="total-row">
            <span>Discount (%)</span>
            <input id="discount" type="number" min="0" value="0">
          </div>
          <div class="total-row grand-total">
            <span>Total</span>
            <strong id="grandTotal">0.00</strong>
          </div>
        </div>
      </div>

      <div class="signature-section">
        <h3>Signature</h3>
        <input id="signature-upload" type="file" accept="image/*" hidden>
        <div id="signatureBox" class="signature-uploader" role="button" tabindex="0" aria-label="Upload signature image" title="Upload signature image">Add Signature</div>
      </div>
    </section>

    <section id="savedContainer" class="saved-invoices-container" hidden>
      <h2>Saved Invoices</h2>
      <ul id="savedInvoicesList" class="saved-invoices-list"></ul>
    </section>
  </main>

  <script src="vendor/html2canvas.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script>
    const DEFAULT_LOGO = 'truffleandscent_logo_2.png';
    const STORAGE_KEY = 'truffleScentInvoiceV12';
    const SAVED_KEY = 'truffleScentSavedInvoicesV12';
    const LEGACY_STORAGE_KEYS = ['truffleScentInvoiceV11', 'truffleScentInvoiceV10', 'truffleScentInvoiceV9', 'currentInvoice'];
    const LEGACY_SAVED_KEYS = ['truffleScentSavedInvoicesV11', 'truffleScentSavedInvoicesV10', 'truffleScentSavedInvoicesV9', 'savedInvoices'];

    const CANONICAL_FROM = [
      'Truffle & Scent By Lee',
      'DTI BN No. 8301368',
      'TIN: 807-789-743-000',
      'Pembo Taguig',
      'Manila, Philippines',
      '+63956 533 1521'
    ].join('\n');

    const DEFAULT_PAYMENT_METHOD = [
      'BPI: 1616155124',
      'AILEEN ALVAREZ',
      'GCASH: 09549848144'
    ].join('\n');

    const defaultInvoice = {
      logo: DEFAULT_LOGO,
      signature: '',
      invoiceNumber: 'INV-T&SBLEE000',
      date: new Date().toISOString().split('T')[0],
      from: CANONICAL_FROM,
      to: '',
      items: [{ name: 'Mazza Deluxe Black Truffle', qty: 1, price: 649, image: '' }],
      notes: 'Thank you for your business. Please pay within the day.',
      paymentMethod: DEFAULT_PAYMENT_METHOD,
      currency: 'PHP',
      discount: 0
    };

    let invoice = loadCurrent();

    const els = {
      logo: document.getElementById('logo-preview'),
      logoUpload: document.getElementById('logo-upload'),
      signatureUpload: document.getElementById('signature-upload'),
      signatureBox: document.getElementById('signatureBox'),
      invoiceNumber: document.getElementById('invoiceNumber'),
      invoiceDate: document.getElementById('invoiceDate'),
      from: document.getElementById('from'),
      to: document.getElementById('to'),
      notes: document.getElementById('notes'),
      paymentMethod: document.getElementById('paymentMethod'),
      currency: document.getElementById('currency'),
      discount: document.getElementById('discount'),
      itemsBody: document.getElementById('itemsBody'),
      subtotal: document.getElementById('subtotal'),
      grandTotal: document.getElementById('grandTotal'),
      savedContainer: document.getElementById('savedContainer'),
      savedList: document.getElementById('savedInvoicesList')
    };

    function loadCurrent() {
      const current = readStoredInvoice(STORAGE_KEY, false);
      if (current) {
        return current;
      }

      for (const key of LEGACY_STORAGE_KEYS) {
        const legacy = readStoredInvoice(key, true);
        if (legacy) {
          return legacy;
        }
      }

      return normaliseInvoice(defaultInvoice);
    }

    function readStoredInvoice(key, forceDefaultLogo) {
      try {
        const stored = JSON.parse(localStorage.getItem(key) || 'null');
        return stored ? normaliseInvoice(stored, { forceDefaultLogo }) : null;
      } catch (error) {
        return null;
      }
    }

    function normaliseInvoice(value, options = {}) {
      const inv = { ...defaultInvoice, ...(value || {}) };
      inv.from = normaliseFrom(inv.from);
      inv.paymentMethod = normalisePaymentMethod(inv.paymentMethod);
      if (!Array.isArray(inv.items) || inv.items.length === 0) {
        inv.items = [...defaultInvoice.items];
      }
      if (!inv.logo || options.forceDefaultLogo) {
        inv.logo = DEFAULT_LOGO;
      }
      return inv;
    }

    function normaliseFrom(value) {
      const text = value || CANONICAL_FROM;
      if (text.includes('Truffle & Scent By Lee')) {
        return CANONICAL_FROM;
      }
      if (text.includes('DTI BN No. 8301368') && !text.includes('TIN: 807-789-743-000')) {
        return text.replace('DTI BN No. 8301368', 'DTI BN No. 8301368\nTIN: 807-789-743-000');
      }
      return text;
    }

    function normalisePaymentMethod(value) {
      const text = normaliseNewlines(value || DEFAULT_PAYMENT_METHOD).trim();
      if (!text) {
        return DEFAULT_PAYMENT_METHOD;
      }
      if (text.includes('BDO: 008010348061') || text.includes('CASH ON DELIVERY') || text.includes('GCash: 0954 984 8144') || text.includes('GCash: 0956 533 1521')) {
        return DEFAULT_PAYMENT_METHOD;
      }
      return text;
    }

    function saveCurrent() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(invoice));
    }

    function readControlsToInvoice() {
      invoice.invoiceNumber = els.invoiceNumber.value;
      invoice.date = els.invoiceDate.value;
      invoice.from = normaliseNewlines(els.from.value);
      invoice.to = normaliseNewlines(els.to.value);
      invoice.notes = normaliseNewlines(els.notes.value);
      invoice.paymentMethod = normaliseNewlines(els.paymentMethod.value);
      invoice.currency = els.currency.value;
      invoice.discount = Number(els.discount.value || 0);
    }

    function normaliseNewlines(value) {
      return String(value || '').replace(/\r\n/g, '\n');
    }

    function formatMoney(value) {
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: invoice.currency
      }).format(Number(value || 0));
    }

    function subtotal() {
      return invoice.items.reduce((sum, item) => sum + Number(item.qty || 0) * Number(item.price || 0), 0);
    }

    function total() {
      const sub = subtotal();
      return sub - (sub * Number(invoice.discount || 0) / 100);
    }

    function readFileAsDataURL(file, callback, onError) {
      const reader = new FileReader();
      reader.onload = event => callback(event.target.result);
      reader.onerror = () => {
        if (onError) onError();
      };
      reader.readAsDataURL(file);
    }

    function autoGrowTextarea(el) {
      el.style.height = 'auto';
      el.style.height = `${Math.max(el.scrollHeight, el.offsetHeight)}px`;
    }

    function render() {
      els.logo.src = invoice.logo || DEFAULT_LOGO;
      els.invoiceNumber.value = invoice.invoiceNumber;
      els.invoiceDate.value = invoice.date;
      els.from.value = invoice.from;
      els.to.value = invoice.to;
      els.notes.value = invoice.notes;
      els.paymentMethod.value = invoice.paymentMethod;
      els.currency.value = invoice.currency;
      els.discount.value = invoice.discount;

      renderItems();
      renderSignature();
      updateTotals();
      renderSavedInvoices();
      requestAnimationFrame(() => {
        document.querySelectorAll('textarea').forEach(autoGrowTextarea);
      });
    }

    function renderItems() {
      els.itemsBody.innerHTML = '';
      invoice.items.forEach((item, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>
            <input type="file" accept="image/*" id="item-upload-${index}" hidden>
            <div class="item-image-uploader ${item.image ? '' : 'empty'}" data-action="item-image" data-index="${index}" aria-label="Add item image">
              ${item.image ? `<img src="${item.image}" alt="${escapeHtml(item.name || 'Item')}">` : '+'}
            </div>
          </td>
          <td><input type="text" data-field="name" data-index="${index}" value="${escapeAttr(item.name || '')}" placeholder="Item name"></td>
          <td><input type="number" data-field="qty" data-index="${index}" value="${Number(item.qty || 0)}" min="1"></td>
          <td><input type="number" data-field="price" data-index="${index}" value="${Number(item.price || 0)}" min="0" step="0.01"></td>
          <td class="item-total-cell">${formatMoney(Number(item.qty || 0) * Number(item.price || 0))}</td>
          <td class="item-action-cell"><button class="button btn-icon" data-action="remove" data-index="${index}" aria-label="Remove item">Remove</button></td>
        `;
        els.itemsBody.appendChild(row);

        const upload = row.querySelector(`#item-upload-${index}`);
        upload.addEventListener('change', event => {
          const file = event.target.files && event.target.files[0];
          if (file) {
            readFileAsDataURL(file, result => {
              invoice.items[index].image = result;
              renderAndSave();
            });
          }
        });
      });
    }

    function renderSignature() {
      els.signatureBox.setAttribute('role', 'button');
      els.signatureBox.setAttribute('tabindex', '0');
      els.signatureBox.setAttribute('aria-label', invoice.signature ? 'Change signature image' : 'Upload signature image');
      els.signatureBox.setAttribute('title', invoice.signature ? 'Change signature image' : 'Upload signature image');
      if (invoice.signature) {
        els.signatureBox.className = 'signature-container';
        els.signatureBox.innerHTML = `<img src="${invoice.signature}" alt="Signature">`;
      } else {
        els.signatureBox.className = 'signature-uploader';
        els.signatureBox.textContent = 'Add Signature';
      }
    }

    function renderAndSave() {
      saveCurrent();
      render();
    }

    function updateTotals() {
      els.subtotal.textContent = formatMoney(subtotal());
      els.grandTotal.textContent = formatMoney(total());
    }

    function renderSavedInvoices() {
      const saved = getSavedInvoices();
      els.savedContainer.hidden = saved.length === 0;
      els.savedList.innerHTML = '';
      saved.forEach((inv, index) => {
        const li = document.createElement('li');
        li.className = 'saved-invoice-item';
        li.innerHTML = `<span>${escapeHtml(inv.invoiceNumber || 'Invoice')} - ${escapeHtml((inv.to || '').split('\n')[0] || 'No recipient')}</span>
          <div class="saved-invoice-actions"><button class="button btn-secondary" data-load="${index}">Load</button><button class="button btn-icon" data-delete="${index}">Delete</button></div>`;
        els.savedList.appendChild(li);
      });
    }

    function getSavedInvoices() {
      const saved = readSavedInvoices(SAVED_KEY);
      if (saved.length > 0) {
        return saved;
      }

      for (const key of LEGACY_SAVED_KEYS) {
        const legacy = readSavedInvoices(key);
        if (legacy.length > 0) {
          return legacy.map(inv => normaliseInvoice(inv, { forceDefaultLogo: true }));
        }
      }

      return [];
    }

    function readSavedInvoices(key) {
      try {
        const value = JSON.parse(localStorage.getItem(key) || '[]');
        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/'/g, '&#39;');
    }

    function wireEvents() {
      els.invoiceNumber.addEventListener('input', () => {
        invoice.invoiceNumber = els.invoiceNumber.value;
        saveCurrent();
      });

      els.invoiceDate.addEventListener('input', () => {
        invoice.date = els.invoiceDate.value;
        saveCurrent();
      });

      ['from', 'to', 'notes', 'paymentMethod'].forEach(id => {
        els[id].addEventListener('input', () => {
          invoice[id] = normaliseNewlines(els[id].value);
          autoGrowTextarea(els[id]);
          saveCurrent();
        });
      });

      els.currency.addEventListener('change', () => {
        invoice.currency = els.currency.value;
        renderAndSave();
      });

      els.discount.addEventListener('input', () => {
        invoice.discount = Number(els.discount.value || 0);
        updateTotals();
        saveCurrent();
      });

      els.logo.addEventListener('click', () => els.logoUpload.click());
      els.logoUpload.addEventListener('change', event => {
        const file = event.target.files && event.target.files[0];
        if (file) {
          readFileAsDataURL(file, result => {
            invoice.logo = result;
            renderAndSave();
          });
        }
      });

      els.signatureBox.addEventListener('click', () => els.signatureUpload.click());
      els.signatureBox.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          els.signatureUpload.click();
        }
      });
      els.signatureUpload.addEventListener('change', event => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          alert('Please choose an image file for the signature.');
          event.target.value = '';
          return;
        }
        if (file) {
          readFileAsDataURL(file, result => {
            invoice.signature = result;
            renderAndSave();
            event.target.value = '';
          }, () => {
            alert('The signature image could not be loaded. Please try another image file.');
            event.target.value = '';
          });
        }
      });

      document.getElementById('addItemBtn').addEventListener('click', () => {
        invoice.items.push({ name: '', qty: 1, price: 0, image: '' });
        renderAndSave();
      });

      els.itemsBody.addEventListener('input', event => {
        const target = event.target;
        if (!target.dataset.field) return;
        const index = Number(target.dataset.index);
        const field = target.dataset.field;
        invoice.items[index][field] = field === 'name' ? target.value : Number(target.value || 0);
        const row = target.closest('tr');
        if (row) {
          row.querySelector('.item-total-cell').textContent = formatMoney(Number(invoice.items[index].qty || 0) * Number(invoice.items[index].price || 0));
        }
        updateTotals();
        saveCurrent();
      });

      els.itemsBody.addEventListener('click', event => {
        const target = event.target.closest('[data-action]');
        if (!target) return;
        const index = Number(target.dataset.index);
        if (target.dataset.action === 'remove') {
          invoice.items.splice(index, 1);
          if (invoice.items.length === 0) {
            invoice.items.push({ name: '', qty: 1, price: 0, image: '' });
          }
          renderAndSave();
        } else if (target.dataset.action === 'item-image') {
          const input = document.getElementById(`item-upload-${index}`);
          if (input) input.click();
        }
      });

      document.getElementById('saveInvoiceBtn').addEventListener('click', () => {
        readControlsToInvoice();
        let saved = getSavedInvoices();
        const index = saved.findIndex(inv => inv.invoiceNumber === invoice.invoiceNumber);
        if (index >= 0) {
          saved[index] = invoice;
        } else {
          saved.push(invoice);
        }
        localStorage.setItem(SAVED_KEY, JSON.stringify(saved));
        saveCurrent();
        renderSavedInvoices();
      });

      els.savedList.addEventListener('click', event => {
        const load = event.target.dataset.load;
        const del = event.target.dataset.delete;
        let saved = getSavedInvoices();
        if (load !== undefined) {
          invoice = normaliseInvoice(saved[Number(load)], { forceDefaultLogo: true });
          renderAndSave();
        }
        if (del !== undefined) {
          saved.splice(Number(del), 1);
          localStorage.setItem(SAVED_KEY, JSON.stringify(saved));
          renderSavedInvoices();
        }
      });

      document.getElementById('downloadPdfBtn').addEventListener('click', downloadPdf);
    }

    async function downloadPdf() {
      const invoiceBox = document.getElementById('invoice-box');
      if (!window.html2canvas || !window.jspdf) {
        alert('PDF tools are still loading. Please try again in a moment.');
        return;
      }

      readControlsToInvoice();
      saveCurrent();

      const clone = invoiceBox.cloneNode(true);
      clone.classList.add('pdf-export');
      clone.style.position = 'absolute';
      clone.style.left = '-10000px';
      clone.style.top = '0';
      clone.style.width = '872px';
      clone.style.minWidth = '872px';
      clone.style.maxWidth = '872px';
      clone.style.zIndex = '-1';

      syncControlsIntoClone(invoiceBox, clone);
      replaceMultilineFieldsForPdf(invoiceBox, clone);

      document.body.appendChild(clone);

      try {
        await waitForImages(clone);
        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        const canvas = await html2canvas(clone, {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          backgroundColor: '#ffffff',
          windowWidth: 1000,
          width: clone.scrollWidth,
          height: clone.scrollHeight
        });

        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();
        const margin = 8;
        const printableWidth = pageWidth - margin * 2;
        const printableHeight = pageHeight - margin * 2;
        const imageHeight = canvas.height * printableWidth / canvas.width;

        let remainingHeight = imageHeight;
        let y = margin;

        pdf.addImage(imgData, 'PNG', margin, y, printableWidth, imageHeight);
        remainingHeight -= printableHeight;

        while (remainingHeight > 0) {
          y -= printableHeight;
          pdf.addPage();
          pdf.addImage(imgData, 'PNG', margin, y, printableWidth, imageHeight);
          remainingHeight -= printableHeight;
        }

        pdf.save(`${invoice.invoiceNumber || 'invoice'}.pdf`);
      } finally {
        if (clone.parentNode) {
          clone.parentNode.removeChild(clone);
        }
      }
    }

    function syncControlsIntoClone(source, clone) {
      const sourceControls = source.querySelectorAll('input, textarea, select');
      const cloneControls = clone.querySelectorAll('input, textarea, select');
      sourceControls.forEach((sourceControl, index) => {
        const cloneControl = cloneControls[index];
        if (!cloneControl) return;
        if (sourceControl.type === 'file') return;
        if (sourceControl.tagName === 'SELECT') {
          cloneControl.value = sourceControl.value;
        } else {
          cloneControl.value = sourceControl.value;
        }
      });
    }

    function replaceMultilineFieldsForPdf(source, clone) {
      const sourceFields = source.querySelectorAll('[data-multiline-field]');
      const cloneFields = clone.querySelectorAll('[data-multiline-field]');
      sourceFields.forEach((sourceField, index) => {
        const cloneField = cloneFields[index];
        if (!cloneField) return;
        const replacement = document.createElement('div');
        replacement.className = 'pdf-text-block';
        replacement.textContent = normaliseNewlines(sourceField.value);
        const sourceStyle = window.getComputedStyle(sourceField);
        replacement.style.font = sourceStyle.font;
        replacement.style.color = sourceStyle.color;
        replacement.style.lineHeight = sourceStyle.lineHeight;
        replacement.style.padding = sourceStyle.padding;
        replacement.style.minHeight = `${Math.max(sourceField.scrollHeight, sourceField.offsetHeight)}px`;
        replacement.style.whiteSpace = 'pre-wrap';
        replacement.style.overflowWrap = 'break-word';
        replacement.style.wordBreak = 'normal';
        cloneField.parentNode.replaceChild(replacement, cloneField);
      });
    }

    function waitForImages(root) {
      const images = Array.from(root.querySelectorAll('img'));
      return Promise.all(images.map(img => {
        if (img.complete && img.naturalWidth !== 0) {
          return Promise.resolve();
        }
        return new Promise(resolve => {
          img.onload = resolve;
          img.onerror = resolve;
        });
      }));
    }

    wireEvents();
    renderAndSave();
  </script>
</body>
</html>
