<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Restart Required</title>
  <style>
    :root {
      --page-bg: #f6f8fb;
      --panel-bg: #ffffff;
      --text: #172033;
      --muted: #5f6b7a;
      --border: #d8dee8;
      --blue: #1f5eff;
      --blue-dark: #1746bf;
      --warning-bg: #fff7ed;
      --warning-border: #fed7aa;
      --warning-text: #9a3412;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, Helvetica, sans-serif;
      background: var(--page-bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 clamp(20px, 5vw, 64px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #111827;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(31, 94, 255, 0.22);
    }

    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(32px, 7vw, 80px) 20px;
    }

    .status-card {
      width: min(760px, 100%);
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 55px rgba(22, 33, 54, 0.10);
      overflow: hidden;
    }

    .status-accent {
      height: 5px;
      background: linear-gradient(90deg, var(--blue), #60a5fa);
    }

    .content {
      padding: clamp(28px, 5vw, 52px);
    }

    .status-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 13px;
      border-radius: 999px;
      border: 1px solid var(--warning-border);
      background: var(--warning-bg);
      color: var(--warning-text);
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .pulse {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f97316;
      box-shadow: 0 0 0 rgba(249, 115, 22, 0.55);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.50); }
      70% { box-shadow: 0 0 0 9px rgba(249, 115, 22, 0); }
      100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4.5vw, 3.3rem);
      line-height: 1.08;
      letter-spacing: -0.035em;
      color: #101827;
    }

    .message {
      margin: 18px 0 0;
      max-width: 620px;
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      line-height: 1.65;
      color: var(--muted);
    }

    .notice-box {
      margin-top: 30px;
      padding: 18px 20px;
      border: 1px solid #dbeafe;
      border-radius: 14px;
      background: #f8fbff;
      color: #1e3a8a;
      font-size: 0.98rem;
      line-height: 1.55;
    }

    .footer {
      border-top: 1px solid var(--border);
      padding: 18px clamp(28px, 5vw, 52px);
      color: #7a8494;
      font-size: 0.9rem;
      background: #fbfcfe;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    @media (max-width: 560px) {
      .topbar { height: 58px; }
      .content { padding: 28px 22px; }
      .footer { padding: 16px 22px; }
    }
  </style>
</head>
<body>
  <header class="topbar" aria-label="Service notice header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">!</span>
      <span>Service Status</span>
    </div>
  </header>

  <main class="main">
    <section class="status-card" role="alert" aria-labelledby="status-title">
      <div class="status-accent"></div>
      <div class="content">
        <div class="status-label">
          <span class="pulse" aria-hidden="true"></span>
          System Notice
        </div>

        <h1 id="status-title">Server restart required.</h1>

        <p class="message">Please contact administrator.</p>

        <div class="notice-box">
          Access is temporarily restricted while the server restart is pending.
        </div>
      </div>

      <div class="footer">
        <span>Status: Action required</span>
        <span>Reference: SRV-RESTART</span>
      </div>
    </section>
  </main>
</body>
</html>
